<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex">
<title>Mission Multiplication - De la Terre à la Lune</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Trebuchet MS', sans-serif;
    background: #000;
    color: #fff;
    overflow: hidden;
    height: 100vh;
    user-select: none;
  }

  #game {
    position: relative;
    width: 100vw;
    height: 100vh;
    background: radial-gradient(ellipse at center, #1b2735 0%, #090a0f 100%);
    overflow: hidden;
  }

  .stars {
    position: absolute;
    top: 0;
    left: 0;
    width: 200%;
    height: 100%;
    background-image:
      radial-gradient(2px 2px at 20px 30px, white, transparent),
      radial-gradient(1px 1px at 40px 70px, white, transparent),
      radial-gradient(1px 1px at 90px 40px, white, transparent),
      radial-gradient(2px 2px at 130px 80px, white, transparent),
      radial-gradient(1px 1px at 160px 120px, white, transparent),
      radial-gradient(2px 2px at 200px 50px, white, transparent),
      radial-gradient(1px 1px at 240px 90px, white, transparent),
      radial-gradient(1px 1px at 280px 30px, white, transparent),
      radial-gradient(2px 2px at 320px 110px, white, transparent),
      radial-gradient(1px 1px at 360px 60px, white, transparent),
      radial-gradient(1px 1px at 100px 150px, white, transparent),
      radial-gradient(2px 2px at 220px 200px, white, transparent),
      radial-gradient(1px 1px at 300px 250px, white, transparent),
      radial-gradient(1px 1px at 50px 300px, white, transparent),
      radial-gradient(2px 2px at 180px 350px, white, transparent);
    background-size: 400px 400px;
    background-repeat: repeat;
    animation: scroll-stars 30s linear infinite;
  }

  .stars.fast {
    animation-duration: 4s;
  }

  .stars.crashed {
    animation-play-state: paused;
  }

  @keyframes scroll-stars {
    from { transform: translateX(0); }
    to { transform: translateX(-50%); }
  }

  .hud {
    position: absolute;
    top: 20px;
    left: 0;
    right: 0;
    display: flex;
    justify-content: space-around;
    z-index: 10;
    pointer-events: none;
  }

  .hud-item {
    background: rgba(0, 30, 60, 0.7);
    border: 2px solid #00d4ff;
    border-radius: 10px;
    padding: 10px 20px;
    font-size: 1.2em;
    text-shadow: 0 0 10px #00d4ff;
    box-shadow: 0 0 20px rgba(0, 212, 255, 0.3);
  }

  .journey {
    position: absolute;
    top: 55%;
    left: 5%;
    right: 5%;
    height: 4px;
    background: linear-gradient(90deg,
      rgba(100, 180, 255, 0.6) 0%,
      rgba(255, 255, 255, 0.3) 50%,
      rgba(245, 245, 220, 0.7) 100%);
    border-radius: 2px;
    z-index: 2;
    box-shadow: 0 0 15px rgba(255, 255, 255, 0.2);
  }

  .earth {
    position: absolute;
    top: 50%;
    left: 3%;
    transform: translateY(-50%);
    width: 90px;
    height: 90px;
    z-index: 3;
    filter: drop-shadow(0 0 25px #4a90e2);
    animation: planet-glow 4s ease-in-out infinite;
  }

  .earth img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
  }

  .mars {
    position: absolute;
    top: 50%;
    right: 3%;
    transform: translateY(-50%);
    width: 90px;
    height: 90px;
    z-index: 3;
    filter: drop-shadow(0 0 25px #c0c0c0);
    animation: planet-glow 4s ease-in-out infinite;
  }

  .mars img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
  }

  @keyframes planet-glow {
    0%, 100% { transform: translateY(-50%) scale(1); }
    50% { transform: translateY(-50%) scale(1.05); }
  }

  .planet-label {
    position: absolute;
    top: calc(50% + 75px);
    font-size: 1em;
    font-weight: bold;
    z-index: 3;
    text-shadow: 0 0 10px currentColor;
  }

  .label-earth {
    left: 3%;
    transform: translateX(15px);
    color: #4a90e2;
  }

  .label-mars {
    right: 3%;
    transform: translateX(-15px);
    color: #f5f5dc;
  }

  .ship {
    position: absolute;
    top: 50%;
    left: 8%;
    transform: translateY(-50%);
    width: 70px;
    height: 70px;
    z-index: 5;
    filter: drop-shadow(0 0 15px #00d4ff);
    transition: left 0.7s cubic-bezier(0.34, 1.2, 0.64, 1);
  }

  .ship img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
    transform: rotate(90deg);
  }

  .ship.advance {
    animation: thrust 0.7s ease-out;
  }

  .ship.crashed {
    animation: crash 1.5s ease-in forwards;
  }

  .ship.return {
    transition: left 1.2s cubic-bezier(0.45, 0, 0.55, 1);
  }

  @keyframes thrust {
    0% { transform: translateY(-50%) scale(1); }
    30% { transform: translateY(-50%) translateY(-15px) scale(1.1); filter: drop-shadow(0 0 30px #00ffaa); }
    100% { transform: translateY(-50%) scale(1); }
  }

  @keyframes crash {
    0% { transform: translateY(-50%) rotate(0) scale(1); opacity: 1; }
    40% { transform: translateY(-50%) rotate(180deg) scale(0.9); opacity: 0.9; }
    100% { transform: translateY(-50%) translateY(80px) rotate(720deg) scale(0.2); opacity: 0; }
  }

  .ship-trail {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    font-size: 30px;
    z-index: 4;
    opacity: 0;
    pointer-events: none;
  }

  .ship-trail.active {
    animation: trail 0.7s ease-out;
  }

  @keyframes trail {
    0% { opacity: 0.9; transform: translateY(-50%) scale(1); }
    100% { opacity: 0; transform: translateY(-50%) scale(0.3) translateX(-50px); }
  }

  .question-box {
    position: absolute;
    top: 18%;
    left: 50%;
    transform: translateX(-50%);
    text-align: center;
    z-index: 10;
  }

  .question {
    font-size: 4.5em;
    font-weight: bold;
    text-shadow: 0 0 20px #00d4ff, 0 0 40px #00d4ff;
    margin-bottom: 20px;
    color: #fff;
  }

  .answer-input {
    width: 200px;
    height: 75px;
    font-size: 2.8em;
    text-align: center;
    background: rgba(0, 30, 60, 0.8);
    border: 3px solid #00d4ff;
    border-radius: 15px;
    color: #fff;
    outline: none;
    box-shadow: 0 0 30px rgba(0, 212, 255, 0.5);
    font-family: 'Trebuchet MS', sans-serif;
    font-weight: bold;
  }

  .answer-input:focus {
    border-color: #00ffaa;
    box-shadow: 0 0 40px rgba(0, 255, 170, 0.7);
  }

  .hint {
    margin-top: 15px;
    font-size: 1em;
    opacity: 0.7;
  }

  .feedback {
    position: absolute;
    top: 72%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 3em;
    font-weight: bold;
    opacity: 0;
    pointer-events: none;
    z-index: 20;
    text-align: center;
  }

  .feedback.show-success {
    animation: pop-success 1.2s ease-out;
    color: #00ff88;
    text-shadow: 0 0 20px #00ff88;
  }

  .feedback.show-fail {
    animation: pop-fail 1.8s ease-out;
    color: #ff3366;
    text-shadow: 0 0 20px #ff3366;
  }

  /* Version persistante : pop in, reste affiché */
  .feedback.show-fail-persist {
    opacity: 1;
    color: #ff3366;
    text-shadow: 0 0 20px #ff3366;
    animation: pop-fail-stay 0.6s ease-out;
  }

  .hint.continue-hint {
    color: #ffaa44;
    opacity: 1;
    animation: hint-blink 1s ease-in-out infinite alternate;
  }

  @keyframes hint-blink {
    from { opacity: 0.6; }
    to   { opacity: 1; }
  }

  @keyframes pop-success {
    0% { opacity: 0; transform: translate(-50%, -50%) scale(0.5); }
    30% { opacity: 1; transform: translate(-50%, -50%) scale(1.3); }
    70% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    100% { opacity: 0; transform: translate(-50%, -50%) scale(1); }
  }

  @keyframes pop-fail {
    0% { opacity: 0; transform: translate(-50%, -50%) scale(0.5); }
    30% { opacity: 1; transform: translate(-50%, -50%) scale(1.2) rotate(-3deg); }
    70% { opacity: 1; transform: translate(-50%, -50%) scale(1) rotate(0); }
    100% { opacity: 0; transform: translate(-50%, -50%) scale(1); }
  }

  @keyframes pop-fail-stay {
    0%   { opacity: 0; transform: translate(-50%, -50%) scale(0.4); }
    50%  { opacity: 1; transform: translate(-50%, -50%) scale(1.25) rotate(-2deg); }
    100% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  }

  .explosion {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    font-size: 130px;
    opacity: 0;
    z-index: 6;
    pointer-events: none;
  }

  .explosion.boom {
    animation: explode 1.5s ease-out forwards;
  }

  @keyframes explode {
    0% { opacity: 0; transform: translateY(-50%) scale(0.3); }
    30% { opacity: 1; transform: translateY(-50%) scale(1.8); }
    100% { opacity: 0; transform: translateY(-50%) scale(2.8); }
  }

  .start-screen, .end-screen {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.88);
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    z-index: 100;
    padding: 20px;
  }

  .start-screen.show, .end-screen.show {
    display: flex;
  }

  .start-screen h1 {
    font-size: 3em;
    margin-bottom: 15px;
    color: #00d4ff;
    text-shadow: 0 0 20px #00d4ff;
    text-align: center;
  }

  .start-screen .subtitle {
    font-size: 1.3em;
    margin-bottom: 30px;
    opacity: 0.85;
    text-align: center;
  }

  .tables-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 12px;
    margin-bottom: 25px;
    max-width: 600px;
  }

  .table-choice {
    position: relative;
    cursor: pointer;
  }

  .table-choice input {
    position: absolute;
    opacity: 0;
    pointer-events: none;
  }

  .table-choice label {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 90px;
    height: 90px;
    background: rgba(0, 30, 60, 0.6);
    border: 3px solid #00d4ff;
    border-radius: 15px;
    font-size: 2em;
    font-weight: bold;
    cursor: pointer;
    transition: all 0.2s ease;
    color: #fff;
  }

  .table-choice label:hover {
    background: rgba(0, 60, 120, 0.8);
    transform: translateY(-3px);
  }

  .table-choice input:checked + label {
    background: #00d4ff;
    color: #000;
    box-shadow: 0 0 25px rgba(0, 212, 255, 0.7);
    transform: translateY(-2px);
  }

  /* Sélecteur de planète destination */
  .planet-selector {
    display: flex;
    gap: 12px;
    margin-bottom: 20px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .planet-option {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 10px 16px;
    background: rgba(0, 30, 60, 0.6);
    border: 3px solid rgba(0, 212, 255, 0.35);
    border-radius: 12px;
    cursor: pointer;
    transition: all 0.2s;
    min-width: 80px;
  }

  .planet-option:hover {
    border-color: #00d4ff;
    transform: translateY(-3px);
  }

  .planet-option.selected {
    border-color: #00d4ff;
    background: rgba(0, 60, 120, 0.8);
    box-shadow: 0 0 20px rgba(0, 212, 255, 0.5);
    transform: translateY(-2px);
  }

  .planet-option .p-svg img { width: 56px; height: 56px; object-fit: contain; display: block; margin-bottom: 4px; }
  .planet-option .p-name  { font-size: 0.75em; font-weight: bold; opacity: 0.85; letter-spacing: 0.05em; }

  .option-toggle {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 15px;
    padding: 12px 20px;
    background: rgba(0, 30, 60, 0.5);
    border: 2px solid rgba(0, 212, 255, 0.4);
    border-radius: 10px;
    cursor: pointer;
    font-size: 1.1em;
    transition: all 0.2s;
    max-width: 520px;
    width: 100%;
  }

  .option-toggle:hover {
    background: rgba(0, 60, 120, 0.7);
    border-color: #00d4ff;
  }

  .option-toggle input[type="checkbox"] {
    width: 22px;
    height: 22px;
    cursor: pointer;
    accent-color: #00d4ff;
    flex-shrink: 0;
  }

  .option-number {
    width: 58px;
    height: 34px;
    font-size: 1em;
    text-align: center;
    background: rgba(0, 30, 60, 0.8);
    border: 2px solid #00d4ff;
    border-radius: 6px;
    color: #fff;
    outline: none;
    font-family: inherit;
    font-weight: bold;
    flex-shrink: 0;
  }

  .option-number:focus {
    border-color: #00ffaa;
  }

  .timer-bar {
    position: absolute;
    top: 75px;
    left: 50%;
    transform: translateX(-50%);
    width: 320px;
    height: 12px;
    background: rgba(0, 30, 60, 0.6);
    border: 2px solid #00d4ff;
    border-radius: 8px;
    overflow: hidden;
    z-index: 10;
    display: none;
    box-shadow: 0 0 15px rgba(0, 212, 255, 0.3);
  }

  .timer-bar.active {
    display: block;
  }

  .timer-fill {
    height: 100%;
    width: 100%;
    background: linear-gradient(90deg, #00ffaa, #00d4ff);
    transition: width 0.1s linear, background 0.3s;
    box-shadow: 0 0 10px currentColor;
  }

  .timer-fill.warning {
    background: linear-gradient(90deg, #ffaa00, #ff6600);
  }

  .timer-fill.danger {
    background: linear-gradient(90deg, #ff6600, #ff3366);
    animation: pulse-danger 0.4s ease-in-out infinite alternate;
  }

  @keyframes pulse-danger {
    from { box-shadow: 0 0 10px #ff3366; }
    to { box-shadow: 0 0 25px #ff3366; }
  }

  .start-btn {
    padding: 18px 50px;
    font-size: 1.6em;
    background: #00d4ff;
    color: #000;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    font-weight: bold;
    box-shadow: 0 0 30px rgba(0, 212, 255, 0.7);
    font-family: inherit;
    margin-top: 10px;
  }

  .start-btn:hover:not(:disabled) {
    background: #00ffaa;
    transform: scale(1.05);
  }

  .start-btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
    box-shadow: none;
  }

  @media (max-width: 700px) {
    .start-screen h1 { font-size: 2em; }
    .tables-grid { grid-template-columns: repeat(5, 1fr); gap: 8px; }
    .table-choice label { width: 60px; height: 60px; font-size: 1.4em; border-width: 2px; }
    .start-btn { padding: 14px 35px; font-size: 1.2em; }
  }

  .end-screen h1 {
    font-size: 4em;
    margin-bottom: 20px;
    text-shadow: 0 0 20px currentColor;
    text-align: center;
  }

  .end-screen.victory h1 { color: #00ff88; }

  .best-line {
    margin-top: 14px;
    font-size: 1.05em;
    color: #ffd700;
    text-shadow: 0 0 8px rgba(255, 215, 0, 0.5);
    min-height: 1.4em;
    text-align: center;
  }
  .new-record {
    font-size: 1.4em;
    color: #ffd700;
    text-shadow: 0 0 15px #ffd700;
    margin-bottom: 15px;
    animation: recordPulse 1s ease-in-out infinite alternate;
  }
  @keyframes recordPulse { from { transform: scale(1); } to { transform: scale(1.08); } }
  @media (prefers-reduced-motion: reduce) { .new-record { animation: none; } }
  .scores {
    list-style: none;
    margin: 0 0 25px;
    padding: 12px 22px;
    background: rgba(0, 30, 60, 0.7);
    border: 2px solid #00d4ff;
    border-radius: 10px;
    min-width: 260px;
    font-variant-numeric: tabular-nums;
  }
  .scores-title { font-size: 0.9em; opacity: 0.8; margin-bottom: 6px; text-align: center; }
  .scores li { display: flex; justify-content: space-between; gap: 20px; padding: 3px 0; }
  .scores li.current { color: #00ffaa; font-weight: bold; text-shadow: 0 0 8px #00ffaa; }
  .scores .s-crash { opacity: 0.7; font-size: 0.85em; }
  #chrono { font-variant-numeric: tabular-nums; }
  .end-screen p {
    font-size: 1.5em;
    margin-bottom: 30px;
    text-align: center;
  }

  .restart-btn {
    padding: 15px 40px;
    font-size: 1.5em;
    background: #00d4ff;
    color: #000;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    font-weight: bold;
    box-shadow: 0 0 30px rgba(0, 212, 255, 0.7);
  }

  .restart-btn:hover {
    background: #00ffaa;
    transform: scale(1.05);
  }

  .progress-dots {
    position: absolute;
    top: 55%;
    left: 5%;
    right: 5%;
    height: 4px;
    z-index: 1;
    display: flex;
    justify-content: space-between;
    align-items: center;
    pointer-events: none;
  }

  .dot {
    width: 8px;
    height: 8px;
    background: rgba(255, 255, 255, 0.3);
    border-radius: 50%;
    transition: background 0.3s, box-shadow 0.3s;
  }

  .dot.reached {
    background: #00ffaa;
    box-shadow: 0 0 10px #00ffaa;
  }

  @media (max-width: 700px) {
    .question { font-size: 3.2em; }
    .answer-input { width: 150px; height: 60px; font-size: 2em; }
    .ship  { width: 50px; height: 50px; }
    .earth { width: 60px; height: 60px; }
    .mars  { width: 60px; height: 60px; }
    .hud-item { font-size: 0.9em; padding: 7px 10px; }
    .hud { gap: 5px; }
    .question-box { top: 12%; }
    .timer-bar { width: 80%; top: 65px; }
  }
</style>
</head>
<body>
<div id="game">
  <div class="stars" id="stars"></div>

  <div class="hud">
    <div class="hud-item">Crashs : <span id="crashes">0</span></div>
    <div class="hud-item">Distance : <span id="distance">0</span>/<span id="maxDistance">15</span></div>
    <div class="hud-item">⏱ <span id="chrono">0:00.0</span></div>
  </div>

  <div class="question-box" id="questionBox">
    <div class="question" id="question">3 × 4</div>
    <input type="number" class="answer-input" id="answer" autocomplete="off" autofocus>
    <div class="hint" id="hint">Tape la réponse et appuie sur Entrée</div>
  </div>

  <div class="timer-bar" id="timerBar">
    <div class="timer-fill" id="timerFill"></div>
  </div>

  <div class="feedback" id="feedback"></div>

  <div class="journey"></div>
  <div class="progress-dots" id="dots"></div>

  <div class="earth"><img src="../planets/earth.svg" alt="Terre"></div>
  <div class="planet-label label-earth">TERRE</div>
  <div class="mars" id="destPlanet"><img id="destImg" src="../planets/moon.svg" alt="destination"></div>
  <div class="planet-label label-mars" id="destLabel">LUNE</div>

  <div class="ship" id="ship"><img src="../planets/rocket.svg" alt="fusée"></div>
  <div class="explosion" id="explosion">💥</div>

  <div class="start-screen show" id="startScreen">
    <h1>🚀 MISSION MULTIPLICATION</h1>
    <p class="subtitle">Choisis ta destination</p>
    <div class="planet-selector" id="planetSelector"></div>
    <p class="subtitle" style="margin-top:10px;">Choisis les tables à réviser</p>
    <div class="tables-grid" id="tablesGrid"></div>
    <label class="option-toggle">
      <input type="checkbox" id="timerCheckbox">
      <span>⏱ Mode chrono —</span>
      <input type="number" class="option-number" id="timerSecondsInput" value="10" min="3" max="99" onclick="event.stopPropagation()">
      <span>sec par réponse</span>
    </label>
    <div class="option-toggle" style="cursor:default;">
      <span id="stepsLabel">🚀 Étapes avant la Lune :</span>
      <input type="number" class="option-number" id="stepsInput" value="15" min="1" max="99" onclick="event.stopPropagation()">
    </div>
    <button class="start-btn" id="startBtn" onclick="startGame()">DÉCOLLAGE 🚀</button>
    <div class="best-line" id="bestLine"></div>
  </div>

  <div class="end-screen" id="endScreen">
    <h1 id="endTitle"></h1>
    <p id="endMessage"></p>
    <div class="new-record" id="newRecord" hidden>🏆 NOUVEAU RECORD !</div>
    <div id="scoresWrap" hidden>
      <div class="scores-title">Meilleurs temps pour cette mission</div>
      <ol class="scores" id="scoresList"></ol>
    </div>
    <button class="restart-btn" onclick="backToSelection()">Nouvelle mission</button>
  </div>
</div>

<script>
  const PLANETS = [
    { name: 'LUNE',    label: 'la Lune',    glow: '#c0c0c0', img: '../planets/moon.svg'    },
    { name: 'MARS',    label: 'Mars',        glow: '#ff5522', img: '../planets/mars.svg'    },
    { name: 'SATURNE', label: 'Saturne',     glow: '#d4a020', img: '../planets/saturn.svg'  },
    { name: 'JUPITER', label: 'Jupiter',     glow: '#c87040', img: '../planets/jupiter.svg' },
    { name: 'URANUS',  label: 'Uranus',      glow: '#88ddff', img: '../planets/uranus.svg'  },
    { name: 'MERCURE', label: 'Mercure',     glow: '#aaaaaa', img: '../planets/mercury.svg' },
  ];

  // Facteur B pondéré : 3,4,6,7,8,9 trois fois plus fréquents que 1,2,5,10
  const B_POOL = [1, 2, 3, 3, 3, 4, 4, 4, 5, 6, 6, 6, 7, 7, 7, 8, 8, 8, 9, 9, 9, 10];

  let selectedPlanet = PLANETS[0];
  let crashes = 0;
  let distance = 0;
  let maxDistance = 15;
  let timerDuration = 10;
  let currentA = 0;
  let currentB = 0;
  let isLocked = false;
  let waitingForContinue = false;
  let selectedTables = [];
  let timerEnabled = false;
  let timerStart = 0;
  let timerRafId = null;
  let missionStart = 0;
  let missionTime = 0;
  let chronoRafId = null;

  // ── Chronomètre de mission ──
  const chronoEl = document.getElementById('chrono');

  function formatTime(ms) {
    const tenths = Math.floor(ms / 100);
    const min = Math.floor(tenths / 600);
    const sec = Math.floor((tenths % 600) / 10);
    return min + ':' + String(sec).padStart(2, '0') + '.' + (tenths % 10);
  }

  function startChrono() {
    stopChrono();
    missionStart = performance.now();
    const tick = (now) => {
      chronoEl.textContent = formatTime(now - missionStart);
      chronoRafId = requestAnimationFrame(tick);
    };
    chronoRafId = requestAnimationFrame(tick);
  }

  function stopChrono() {
    if (chronoRafId !== null) {
      cancelAnimationFrame(chronoRafId);
      chronoRafId = null;
    }
  }

  // ── Meilleurs scores (stockés dans ce navigateur) ──
  const SCORES_KEY = 'mission-multiplication:scores:v1';
  const SCORES_KEPT = 5;

  function loadScores() {
    try { return JSON.parse(localStorage.getItem(SCORES_KEY)) || {}; }
    catch (e) { return {}; }
  }

  function saveScores(all) {
    try { localStorage.setItem(SCORES_KEY, JSON.stringify(all)); } catch (e) { /* stockage indisponible */ }
  }

  // Une mission = destination + tables + étapes + mode chrono : seuls les temps d'une même mission se comparent
  function missionKey(planet, tables, steps, timerSec) {
    return [planet.name, tables.slice().sort((a, b) => a - b).join(','), steps, timerSec || 0].join('|');
  }

  function recordScore(key, time, crashCount) {
    const all = loadScores();
    const list = all[key] || [];
    const entry = { time: Math.round(time), crashes: crashCount, date: new Date().toISOString().slice(0, 10) };
    list.push(entry);
    list.sort((a, b) => a.time - b.time || a.crashes - b.crashes);
    all[key] = list.slice(0, SCORES_KEPT);
    saveScores(all);
    return { list: all[key], rank: all[key].indexOf(entry) };
  }

  function currentConfigKey() {
    const timerOn = document.getElementById('timerCheckbox').checked;
    const timerSec = Math.max(3, parseInt(document.getElementById('timerSecondsInput').value) || 10);
    const steps = Math.max(1, parseInt(document.getElementById('stepsInput').value) || 15);
    return missionKey(selectedPlanet, getCheckedTables(), steps, timerOn ? timerSec : 0);
  }

  function updateBestLine() {
    const el = document.getElementById('bestLine');
    if (getCheckedTables().length === 0) { el.textContent = ''; return; }
    const best = (loadScores()[currentConfigKey()] || [])[0];
    el.textContent = best
      ? '🏆 Record pour cette mission : ' + formatTime(best.time) + (best.crashes ? ' (' + best.crashes + ' crash' + (best.crashes > 1 ? 's' : '') + ')' : '')
      : 'Pas encore de record pour cette mission';
  }

  const startScreen = document.getElementById('startScreen');
  const tablesGrid = document.getElementById('tablesGrid');
  const planetSelector = document.getElementById('planetSelector');
  const startBtn = document.getElementById('startBtn');
  const timerBar = document.getElementById('timerBar');
  const timerFill = document.getElementById('timerFill');
  const maxDistanceEl = document.getElementById('maxDistance');
  const destPlanetEl = document.getElementById('destPlanet');
  const destImgEl    = document.getElementById('destImg');
  const destLabelEl  = document.getElementById('destLabel');

  // Génère les options de destination
  PLANETS.forEach((p, i) => {
    const el = document.createElement('div');
    el.className = 'planet-option' + (i === 0 ? ' selected' : '');
    el.innerHTML = `<div class="p-svg"><img src="${p.img}" alt="${p.name}"></div><span class="p-name">${p.name}</span>`;
    el.addEventListener('click', () => {
      planetSelector.querySelectorAll('.planet-option').forEach(o => o.classList.remove('selected'));
      el.classList.add('selected');
      selectedPlanet = p;
      document.getElementById('stepsLabel').textContent = '🚀 Étapes avant ' + p.label + ' :';
      updateBestLine();
    });
    planetSelector.appendChild(el);
  });

  for (let i = 1; i <= 10; i++) {
    const wrapper = document.createElement('div');
    wrapper.className = 'table-choice';
    wrapper.innerHTML = `
      <input type="checkbox" id="table-${i}" value="${i}">
      <label for="table-${i}">${i}</label>
    `;
    tablesGrid.appendChild(wrapper);
  }

  [2, 3, 4, 5].forEach(n => { document.getElementById(`table-${n}`).checked = true; });

  function getCheckedTables() {
    return Array.from(tablesGrid.querySelectorAll('input:checked')).map(el => parseInt(el.value, 10));
  }

  function updateStartButton() {
    startBtn.disabled = getCheckedTables().length === 0;
    updateBestLine();
  }

  tablesGrid.addEventListener('change', updateStartButton);
  ['timerCheckbox', 'timerSecondsInput', 'stepsInput'].forEach(id => {
    document.getElementById(id).addEventListener('input', updateBestLine);
    document.getElementById(id).addEventListener('change', updateBestLine);
  });

  function startGame() {
    selectedTables = getCheckedTables();
    if (selectedTables.length === 0) return;
    timerEnabled = document.getElementById('timerCheckbox').checked;
    timerDuration = Math.max(3, parseInt(document.getElementById('timerSecondsInput').value) || 10);
    maxDistance = Math.max(1, parseInt(document.getElementById('stepsInput').value) || 15);

    waitingForContinue = false;
    startScreen.classList.remove('show');
    questionBox.style.display = 'block';
    shipEl.style.opacity = '1';
    crashes = 0;
    distance = 0;
    crashesEl.textContent = crashes;
    distanceEl.textContent = distance;
    maxDistanceEl.textContent = maxDistance;
    destImgEl.src = selectedPlanet.img;
    destPlanetEl.style.filter = `drop-shadow(0 0 25px ${selectedPlanet.glow})`;
    destLabelEl.textContent = selectedPlanet.name;
    destLabelEl.style.color = selectedPlanet.glow;

    // Rebuild dots for the configured max distance
    dotsContainer.innerHTML = '';
    for (let i = 0; i <= maxDistance; i++) {
      const dot = document.createElement('div');
      dot.className = 'dot';
      dotsContainer.appendChild(dot);
    }

    updateShipPosition();
    updateDots();
    chronoEl.textContent = formatTime(0);
    startChrono();
    newQuestion();
  }

  function backToSelection() {
    stopTimer();
    stopChrono();
    updateBestLine();
    waitingForContinue   = false;
    feedbackEl.className = 'feedback';
    hintEl.className     = 'hint';
    hintEl.textContent   = 'Tape la réponse et appuie sur Entrée';
    endScreen.classList.remove('show', 'victory');
    startScreen.classList.add('show');
  }

  function stopTimer() {
    if (timerRafId !== null) {
      cancelAnimationFrame(timerRafId);
      timerRafId = null;
    }
    timerBar.classList.remove('active');
  }

  function startTimer() {
    if (!timerEnabled) return;
    timerStart = performance.now();
    timerBar.classList.add('active');
    timerFill.classList.remove('warning', 'danger');
    timerFill.style.width = '100%';

    const tick = (now) => {
      const elapsed = (now - timerStart) / 1000;
      const remaining = timerDuration - elapsed;

      if (remaining <= 0) {
        timerFill.style.width = '0%';
        timerRafId = null;
        if (!isLocked) {
          isLocked = true;
          timeoutFail();
        }
        return;
      }

      const ratio = remaining / timerDuration;
      timerFill.style.width = (ratio * 100) + '%';
      if (ratio < 0.25)       { timerFill.classList.add('danger'); timerFill.classList.remove('warning'); }
      else if (ratio < 0.5)   { timerFill.classList.add('warning'); timerFill.classList.remove('danger'); }
      else                    { timerFill.classList.remove('warning', 'danger'); }

      timerRafId = requestAnimationFrame(tick);
    };
    timerRafId = requestAnimationFrame(tick);
  }

  function timeoutFail() {
    showFeedback('⏰ Trop tard ! ' + currentA + ' × ' + currentB + ' = ' + (currentA * currentB), 'fail', true);
    crashShip();
  }

  const START_POS = 8;
  const END_POS = 87;

  const questionEl = document.getElementById('question');
  const answerEl = document.getElementById('answer');
  const crashesEl = document.getElementById('crashes');
  const distanceEl = document.getElementById('distance');
  const shipEl = document.getElementById('ship');
  const explosionEl = document.getElementById('explosion');
  const feedbackEl = document.getElementById('feedback');
  const starsEl = document.getElementById('stars');
  const endScreen = document.getElementById('endScreen');
  const endTitle = document.getElementById('endTitle');
  const endMessage = document.getElementById('endMessage');
  const questionBox = document.getElementById('questionBox');
  const dotsContainer = document.getElementById('dots');
  const hintEl        = document.getElementById('hint');

  function updateShipPosition() {
    const ratio = distance / maxDistance;
    const pos = START_POS + (END_POS - START_POS) * ratio;
    shipEl.style.left = pos + '%';
  }

  function updateDots() {
    const dots = dotsContainer.querySelectorAll('.dot');
    dots.forEach((dot, i) => {
      dot.classList.toggle('reached', i <= distance);
    });
  }

  function newQuestion() {
    currentA = selectedTables[Math.floor(Math.random() * selectedTables.length)];
    currentB = B_POOL[Math.floor(Math.random() * B_POOL.length)];
    questionEl.textContent = currentA + ' × ' + currentB;
    answerEl.value = '';
    answerEl.focus();
    isLocked = false;
    startTimer();
  }

  function showFeedback(text, type, persist) {
    feedbackEl.textContent = text;
    feedbackEl.className   = 'feedback show-' + (persist ? type + '-persist' : type);
    if (!persist) {
      setTimeout(() => { feedbackEl.className = 'feedback'; }, 1500);
    }
  }

  function correctAnswer() {
    stopTimer();
    distance += 1;
    if (distance >= maxDistance) {
      stopChrono();
      missionTime = performance.now() - missionStart;
      chronoEl.textContent = formatTime(missionTime);
    }
    distanceEl.textContent = distance;

    updateShipPosition();
    updateDots();

    shipEl.classList.add('advance');
    starsEl.classList.add('fast');

    const messages = ['BRAVO !', 'SUPER !', 'EN AVANT !', 'PARFAIT !', 'GÉNIAL !'];
    showFeedback(messages[Math.floor(Math.random() * messages.length)], 'success');

    setTimeout(() => {
      shipEl.classList.remove('advance');
      starsEl.classList.remove('fast');
    }, 700);

    if (distance >= maxDistance) {
      setTimeout(() => endGame(), 1500);
    } else {
      setTimeout(newQuestion, 1200);
    }
  }

  function wrongAnswer() {
    const correctValue = currentA * currentB;
    showFeedback('💥 ' + currentA + ' × ' + currentB + ' = ' + correctValue, 'fail', true);
    crashShip();
  }

  function crashShip() {
    stopTimer();
    crashes += 1;
    crashesEl.textContent = crashes;

    const shipLeft = shipEl.style.left || (START_POS + '%');
    explosionEl.style.left = shipLeft;

    shipEl.classList.add('crashed');
    explosionEl.classList.add('boom');
    starsEl.classList.add('crashed');

    setTimeout(() => {
      distance = 0;
      distanceEl.textContent = distance;
      updateDots();

      shipEl.classList.remove('crashed');
      explosionEl.classList.remove('boom');
      starsEl.classList.remove('crashed');

      shipEl.style.transition = 'none';
      shipEl.style.left = START_POS + '%';
      shipEl.style.opacity = '0';

      setTimeout(() => {
        shipEl.style.transition = '';
        shipEl.style.opacity = '1';
        waitingForContinue = true;
        hintEl.className   = 'hint continue-hint';
        hintEl.textContent = 'Appuie sur une touche pour continuer…';
      }, 300);

    }, 2200);
  }

  function endGame() {
    stopTimer();
    questionBox.style.display = 'none';
    endScreen.classList.add('show', 'victory');
    endTitle.textContent = '🎉 BRAVO, TU AS ATTEINT ' + selectedPlanet.label.toUpperCase() + ' !';
    endMessage.innerHTML = 'Temps : <strong>' + formatTime(missionTime) + '</strong> · Crashs : <strong>' + crashes + '</strong>';

    const key = missionKey(selectedPlanet, selectedTables, maxDistance, timerEnabled ? timerDuration : 0);
    const { list, rank } = recordScore(key, missionTime, crashes);
    document.getElementById('newRecord').hidden = rank !== 0;
    const scoresList = document.getElementById('scoresList');
    scoresList.innerHTML = '';
    list.forEach((s, i) => {
      const li = document.createElement('li');
      if (i === rank) li.className = 'current';
      li.innerHTML = '<span>' + (i + 1) + '. ' + formatTime(s.time) + '</span>'
        + '<span class="s-crash">' + s.crashes + ' crash' + (s.crashes > 1 ? 's' : '') + ' · ' + s.date.split('-').reverse().join('/') + '</span>';
      scoresList.appendChild(li);
    });
    document.getElementById('scoresWrap').hidden = false;
  }

  answerEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !isLocked) {
      const userAnswer = parseInt(answerEl.value, 10);
      if (isNaN(userAnswer)) return;
      isLocked = true;
      const correct = currentA * currentB;
      if (userAnswer === correct) {
        correctAnswer();
      } else {
        wrongAnswer();
      }
    }
  });

  function continueAfterCrash() {
    waitingForContinue   = false;
    feedbackEl.className = 'feedback';
    hintEl.className     = 'hint';
    hintEl.textContent   = 'Tape la réponse et appuie sur Entrée';
    newQuestion();
  }

  document.addEventListener('keydown', (e) => {
    if (waitingForContinue) { continueAfterCrash(); return; }
    if (
      document.activeElement !== answerEl &&
      !endScreen.classList.contains('show') &&
      !startScreen.classList.contains('show')
    ) {
      answerEl.focus();
    }
  });

  document.getElementById('game').addEventListener('pointerdown', () => {
    if (waitingForContinue) continueAfterCrash();
  });

  questionBox.style.display = 'none';
  updateShipPosition();
  updateStartButton();
</script>
</body>
</html>
